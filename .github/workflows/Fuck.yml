name: Test Compile (Haxe only)
on: workflow_dispatch

jobs:
  test:
    name: Test Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Fix Haxelib
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flxanimate git
          haxelib set hxdiscord_rpc git

      - name: Haxe compile check
        run: |
          haxelib run lime build android -final -D ONLY_ARM64 > /tmp/build.log 2>&1 &
          PID=$!
          RESULT="timeout"

          for i in $(seq 1 90); do
            sleep 10

            if grep -q "Loop in class building" /tmp/build.log; then
              RESULT="loop"
              break
            fi

            if grep -q "Compiling group" /tmp/build.log; then
              RESULT="ok"
              break
            fi

            if ! kill -0 $PID 2>/dev/null; then
              wait $PID
              CODE=$?
              if [ "$CODE" = "0" ]; then RESULT="ok"; else RESULT="error"; fi
              break
            fi
          done

          kill $PID 2>/dev/null || true
          pkill -f haxe 2>/dev/null || true
          pkill -f hxcpp 2>/dev/null || true

          echo "=============== 40 baris terakhir log ==============="
          tail -n 40 /tmp/build.log
          echo "====================================================="
          echo "HASIL: $RESULT"

          case "$RESULT" in
            ok)
              echo "Compile Haxe LOLOS."
              exit 0 ;;
            loop)
              echo "GAGAL: Loop in class building."
              exit 1 ;;
            error)
              echo "GAGAL: error compile lain, lihat log di atas."
              exit 1 ;;
            *)
              echo "GAGAL: timeout 15 menit tanpa hasil jelas."
              exit 1 ;;
          esac
